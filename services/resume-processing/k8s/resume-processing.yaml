# ADR-001: each service is a Deployment behind a ClusterIP Service.
# Other services reach it at http://resume-processing.hireassist.svc
# Readiness probe decides membership, so discovery and health are one mechanism.
#
# The MongoDB connection string comes from a Secret, never from this file:
#   kubectl -n hireassist create secret generic resume-processing-mongo \
#     --from-literal=MONGO_URL='mongodb+srv://<user>:<password>@<cluster>/'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-processing
  namespace: hireassist
  labels:
    app: resume-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-processing
  template:
    metadata:
      labels:
        app: resume-processing
    spec:
      containers:
        - name: resume-processing
          image: hireassist/resume-processing:1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: resume-processing-mongo
                  key: MONGO_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resume-processing
  namespace: hireassist
spec:
  type: ClusterIP
  selector:
    app: resume-processing
  ports:
    - port: 80
      targetPort: 3000
